<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Registration - Burgener Chalet Board Games</title>
    <meta name="author" content="Richard Burgener" />
    <meta
      name="description"
      content="A site dedicated to the board game offerings for guests staying at The Burgener Chalet"
    />
    <link rel="icon" href="/images/favicon.ico" />

    <link rel="stylesheet" href="/styles/site.css" />
    <script src="/js/pages/account.js" type="module"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kite+One&family=Oldenburg&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header></header>
    <main>
      <h2>Register for an Account</h2>
      <form id="register-form">
        <label for="new-username">Username</label>
        <input type="text" id="new-username" autocomplete="username" required>
      
        <label for="new-password">Password</label>
        <input type="password" id="new-password" required>
      
        <label for="new-confirm-password">Confirm Password</label>
        <input type="password" id="new-confirm-password" required>
      
        <label for="new-name">Name</label>
        <input type="text" id="new-name" autocomplete="name" required>
      
        <label for="new-email">Email</label>
        <input type="email" id="new-email" autocomplete="email" required>
      
        <button id="register-button">Register</button>
      </form>
    </main>
    <footer></footer>
  </body>
</html>
